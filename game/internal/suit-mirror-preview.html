<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="../">
<title>Z-2 and habitat mirror preview</title>
<style>body{margin:0;background:#121719;color:#fff;font:14px system-ui}canvas{display:block}aside{position:fixed;top:16px;left:16px;padding:12px;background:#142027e8;border-radius:6px}button{padding:9px;margin:4px;color:white;background:#345464;border:0;cursor:pointer}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><aside>Habitat mirror · development preview<br><button id="store">Store Z-2 suit</button><button id="wear">Wear Z-2 suit</button></aside>
<script type="module">
import * as THREE from 'three';
import {CrewInterior} from './src/crew-interior.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
const room=new CrewInterior();room.lookInMirror();room.camera.aspect=innerWidth/innerHeight;room.camera.updateProjectionMatrix();
document.querySelector('#store').onclick=()=>room.setSuitEquipped(false);document.querySelector('#wear').onclick=()=>room.setSuitEquipped(true);
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);room.update(Math.min(.05,clock.getDelta()),{},false);renderer.render(room.scene,room.camera);}frame();
window.preview={room,renderer};await room.mirror.ready;window.preview.ready=true;
</script></body></html>
