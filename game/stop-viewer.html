<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gusev stop viewer</title>
<style>
  body { margin: 0; background: #0d0f14; color: #eef1f3; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 10px; left: 10px; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; }
  #bar button { font: inherit; color: #eef1f3; background: #1b1e26cc; border: 1px solid #ffffff2a; border-radius: 9px; padding: 7px 12px; cursor: pointer; }
  #bar button.on { background: #eef1f3; color: #111; }
  #note { position: fixed; bottom: 10px; left: 12px; color: #c9ccd2; font-size: 12px; }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }</script>
</head>
<body>
<div id="bar"></div>
<div id="note">Team tool: look at each Gusev stop on its own. Drag to orbit, scroll to zoom. The ground here is the landmark shape only, not the NASA terrain.</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SITES } from './src/site-data.js';
import { landmarkLift } from './src/landmarks.js';
import { buildStop } from './src/stop-models.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#c99a74'); scene.fog = new THREE.Fog('#c99a74', 60, 190);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .1, 600);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight('#f3d7b8', '#6b4a36', 1.1));
const sun = new THREE.DirectionalLight('#fff1dc', 2.4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 160 }); sun.shadow.bias = -.0006; sun.shadow.normalBias = .03;
scene.add(sun, sun.target);

const n2 = (x, z) => Math.sin(x * .31 + Math.sin(z * .17)) * Math.sin(z * .27 - x * .11) * .18 + Math.sin(x * 1.3 + z * .9) * .03;
const ground = (x, z) => landmarkLift(x, z) + n2(x, z);
let current = null, terrain = null;
function show(id) {
  const s = SITES.find(v => v.id === id) || SITES[0];
  if (current) scene.remove(current); if (terrain) scene.remove(terrain);
  const R = id === 'homeplate' ? 70 : 34, N = id === 'homeplate' ? 280 : 170, ax = s.cx ?? s.x, az = s.cz ?? s.z;
  const geo = new THREE.PlaneGeometry(R * 2, R * 2, N, N); geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position, col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) + ax, z = p.getZ(i) + az, y = ground(x, z); p.setXYZ(i, x, y, z);
    const k = .5 + .5 * Math.sin(x * .7 + z * .45) * Math.sin(z * .6), t = .92 + .1 * k;
    col.set([.62 * t, .44 * t, .33 * t], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.computeVertexNormals();
  terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 })); terrain.receiveShadow = true; scene.add(terrain);
  current = buildStop(s, ground); scene.add(current);
  const c = s.view || { d: 14, h: 6, a: .8 }, fy = ground(s.x, s.z);
  const az2 = Number(q.get('a') ?? c.a), d = Number(q.get('d') ?? c.d), h = Number(q.get('h') ?? c.h);
  controls.target.set(s.x, fy + 1, s.z); camera.position.set(s.x + Math.sin(az2) * d, fy + h, s.z + Math.cos(az2) * d);
  const sa2 = q.get('sun') === 'cam' ? az2 + .7 : .95;   // ?sun=cam lights the side you are looking at
  sun.position.set(s.x + Math.sin(sa2) * 35, fy + 40, s.z + Math.cos(sa2) * 35); sun.target.position.set(s.x, fy, s.z);
  for (const b of bar.children) b.classList.toggle('on', b.dataset.id === s.id);
  window.stopInfo = () => { const info = renderer.info.render; return { calls: info.calls, tris: info.triangles }; };
}
const bar = document.getElementById('bar');
for (const s of SITES) { const b = document.createElement('button'); b.textContent = s.name.split(',')[0]; b.dataset.id = s.id; b.onclick = () => show(s.id); bar.append(b); }
show(q.get('stop') || SITES[0].id);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
window.viewer = { scene, camera, controls, show };
</script>
</body>
</html>
